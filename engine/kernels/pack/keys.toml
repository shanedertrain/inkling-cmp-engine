# Kernel pack keys (package R2, docs/RUST-PLAN.md 3.2): stable key -> kernel instance, per pack TU.
# The instance is the C++ name as the demangler prints it, without parameters and without
# `(anonymous namespace)::`. build.sh forces every instance in its TU (keep_<tu>.inc); `xtask gen-kernels`
# requires each key to resolve to exactly one kernel of that TU's cubin and every kernel of the cubin to have
# a key, and names the Rust launcher after the key. Seeded from the C++ engine's fatbin at ce7de6d
# (bench/raw/2026-11-23-rust-R2-pack/tools/seed_keys.py).

# Launched with cuLaunchCooperativeKernel (grid-wide sync; drafter_rt.cuh markov_coop). The cubin cannot tell:
# EIATTR_COOP_GROUP_INSTR_OFFSETS also marks plain __shfl_*_sync kernels.
cooperative = ["s2f_markov_coop_false", "s2f_markov_coop_true"]

